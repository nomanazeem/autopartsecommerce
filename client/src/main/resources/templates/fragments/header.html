<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Store</title>
    <link rel="stylesheet" href="path/to/font-awesome.css"> <!-- Ensure the correct path to Font Awesome CSS -->
    <link rel="stylesheet" href="path/to/bootstrap.css"> <!-- Ensure the correct path to Bootstrap CSS -->
    <style>
        ::placeholder {
            font-weight: bold;
        }
    </style>
</head>
<body>
<!-- Header Container -->
<header id="header" class="typeheader-4">
    <!-- Header Top -->
    <div class="header-top hidden-compact">
        <div class="container">
            <div class="row">
                <div class="header-top-left col-lg-3 col-md-4 col-sm-5 hidden-xs">
                    <div class="telephone">
                        <ul class="socials">
                            <li class="facebook"><a href="#" target="_blank"><i class="fa fa-facebook"></i></a></li>
                            <li class="twitter"><a href="#" target="_blank"><i class="fa fa-twitter"></i></a></li>
                            <li class="google_plus"><a href="#" target="_blank"><i class="fa fa-google-plus"></i></a></li>
                            <li class="pinterest"><a href="#" target="_blank"><i class="fa fa-pinterest-p"></i></a></li>
                            <li class="instagram"><a href="#" target="_blank"><i class="fa fa-instagram"></i></a></li>
                            <li class="linkedin"><a href="#" target="_blank"><i class="fa fa-linkedin"></i></a></li>
                        </ul>
                    </div>
                </div>
                <div class="header-top-right col-lg-9 col-md-8 col-sm-7 col-xs-12">
                    <ul class="top-log list-inline">
                        <li sec:authorize="isAuthenticated()"><i class="fa fa-lock"></i>Welcome <span sec:authentication="principal.username"></span>!</li>
                        <li sec:authorize="isAuthenticated()"><a th:href="@{/logout}">Logout</a></li>
                        <li sec:authorize="isAnonymous()"><i class="fa fa-lock"></i><a th:href="@{/login}">Login</a> / </li>
                        <li sec:authorize="isAnonymous()"><a th:href="@{/register}">Register</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
    <div class="header-middle">
        <div class="container">
            <div class="row">
                <div class="col-lg-3 col-md-4 col-sm-12 col-xs-12">
                    <div class="logo">
                        <a th:href="@{/}"><img th:src="@{/image/catalog/logo.png}" title="Your Store" alt="Your Store" /></a>
                    </div>
                </div>
                <div class="col-lg-9 col-md-8 col-sm-12 col-xs-12 middle-right">
                    <div class="search-header-w">
                        <div class="icon-search hidden-lg hidden-md"><i class="fa fa-search"></i></div>
                        <div id="sosearchpro" class="sosearchpro-wrapper so-search">
                            <form th:action="@{/client/part-search}" method="GET">
                                <div id="search0" class="search input-group form-group">
                                    <input id="searchInput" class="autosearch-input form-control" type="text" value="" size="50" autocomplete="off" placeholder="Keyword here..." name="name">
                                    <input type="hidden" name="make" value="1"/>
                                    <input type="hidden" name="model" value="1"/>
                                    <input type="hidden" name="year" value=""/>
                                    <input type="hidden" name="category" value=""/>
                                    <button type="submit" class="button-search btn btn-primary"><i class="fa fa-search"></i></button>
                                    <button type="button" id="micButton" class="button-mic btn btn-secondary"><i class="fa fa-microphone"></i></button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="header-bottom hidden-compact">
        <div class="container">
            <div class="row">
                <div class="col-lg-12 col-md-12 col-sm-6 col-xs-6">
                    <div class="main-menu-w">
                        <div class="responsive so-megamenu megamenu-style-dev">
                            <nav class="navbar-default">
                                <div class="container-megamenu horizontal open">
                                    <div class="navbar-header">
                                        <button type="button" id="show-megamenu" data-toggle="collapse" class="navbar-toggle">
                                            <span class="icon-bar"></span>
                                            <span class="icon-bar"></span>
                                            <span class="icon-bar"></span>
                                        </button>
                                    </div>
                                    <div class="megamenu-wrapper">
                                        <span id="remove-megamenu" class="fa fa-times"></span>
                                        <div class="megamenu-pattern">
                                            <div class="container-mega">
                                                <ul class="megamenu" data-transition="slide" data-animationtime="250">
                                                    <li th:class="${classActiveHome}">
                                                        <p class="close-menu"></p>
                                                        <a th:href="@{/client}" class="clearfix">
                                                            <strong><i class="fa fa-home"></i>Home</strong>
                                                        </a>
                                                    </li>
                                                    <li th:class="${classActivePartSearch}">
                                                        <p class="close-menu"></p>
                                                        <a th:href="@{/client/part-search}" class="clearfix">
                                                            <strong><i class="fa fa-search"></i>Part Search</strong>
                                                        </a>
                                                    </li>
                                                    <li th:class="${classActiveCategory}">
                                                        <p class="close-menu"></p>
                                                        <a th:href="@{/client/category}" class="clearfix">
                                                            <strong><i class="fa fa-sitemap"></i>Categories</strong>
                                                        </a>
                                                    </li>
                                                    <li th:class="${classActivePages} == null ? 'with-sub-menu hover': ${classActivePages}">
                                                        <p class="close-menu"></p>
                                                        <a href="#" class="clearfix">
                                                            <strong><i class="fa fa-pagelines"></i>Pages</strong>
                                                            <b class="caret"></b>
                                                        </a>
                                                        <div class="sub-menu" style="width: 40%;">
                                                            <div class="content">
                                                                <div class="row">
                                                                    <div class="col-md-6">
                                                                        <ul class="row-list">
                                                                            <li><a class="subcategory_item" th:href="@{/client/about-us}">About us</a></li>
                                                                            <li><a class="subcategory_item" th:href="@{/client/contact-us}">Contact us</a></li>
                                                                        </ul>
                                                                    </div>
                                                                    <div class="col-md-6">
                                                                        <ul class="row-list">
                                                                            <li><a class="subcategory_item" th:href="@{/client/faq}">FAQ</a></li>
                                                                            <li><a class="subcategory_item" th:href="@{/client/privacy-policy}">Privacy Policy</a></li>
                                                                            <li><a class="subcategory_item" th:href="@{/client/return-policy}">Return Policy</a></li>
                                                                            <li><a class="subcategory_item" th:href="@{/client/terms-and-conditions}">Terms & Conditions</a></li>
                                                                        </ul>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </li>
                                                    <li th:class="${classActiveViewCart}">
                                                        <p class="close-menu"></p>
                                                        <a th:href="@{/client/view-cart}" class="clearfix">
                                                            <strong><i class="fa fa-shopping-cart"></i>View Cart</strong>
                                                        </a>
                                                    </li>
                                                    <li th:class="${classActiveCheckout}">
                                                        <p class="close-menu"></p>
                                                        <a th:href="@{/client/checkout}" class="clearfix">
                                                            <strong><i class="fa fa-check-circle"></i>Checkout</strong>
                                                        </a>
                                                    </li>
                                                    <li th:class="${classActiveMyAccount}">
                                                        <p class="close-menu"></p>
                                                        <a th:href="@{/client/my-account}" class="clearfix">
                                                            <strong><i class="fa fa-dashboard"></i>My Account</strong>
                                                        </a>
                                                    </li>
                                                </ul>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </nav>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>
<!-- //Header Container -->

<!-- Include jQuery and Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
<!-- Optional: include a polyfill for ES6 Promises for IE11 -->
<script src="https://cdn.jsdelivr.net/npm/promise-polyfill@8/dist/polyfill.min.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const searchInput = document.getElementById('searchInput');
        const micButton = document.getElementById('micButton');

        let recognition;
        if ('webkitSpeechRecognition' in window) {
            recognition = new webkitSpeechRecognition();
        } else if ('SpeechRecognition' in window) {
            recognition = new SpeechRecognition();
        } else {
            console.log('Speech Recognition API not supported.');
            micButton.style.display = 'none';
            return;
        }

        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.lang = 'en-US';

        recognition.onresult = function (event) {
            const transcript = event.results[0][0].transcript.trim();
            searchInput.value = transcript;
            navigateBasedOnCommand(transcript);
        };

        recognition.onerror = function (event) {
            console.error(event.error);
        };

        micButton.addEventListener('click', function () {
            recognition.start();
        });

        function navigateBasedOnCommand(command) {
            const tokens = command.split(' ').map(token => token.toLowerCase());

            if (tokens.includes('home')) {
                window.location.href = '/client';
            } else if (tokens.includes('part') && tokens.includes('search')) {
                window.location.href = '/client/part-search';
            } else if (tokens.includes('categories')) {
                window.location.href = '/client/category';
            } else if (tokens.includes('view') && tokens.includes('cart')) {
                window.location.href = '/client/view-cart';
            } else if (tokens.includes('checkout')) {
                window.location.href = '/client/checkout';
            } else if (tokens.includes('account')) {
                window.location.href = '/client/my-account';
            } else if (tokens.includes('about') && tokens.includes('us')) {
                window.location.href = '/client/about-us';
            } else if (tokens.includes('contact') && tokens.includes('us')) {
                window.location.href = '/client/contact-us';
            } else if (tokens.includes('faq')) {
                window.location.href = '/client/faq';
            } else if (tokens.includes('privacy') && tokens.includes('policy')) {
                window.location.href = '/client/privacy-policy';
            } else if (tokens.includes('return') && tokens.includes('policy')) {
                window.location.href = '/client/return-policy';
            } else if (tokens.includes('terms') && tokens.includes('conditions')) {
                window.location.href = '/client/terms-and-conditions';
            } else {
                console.log('Command not recognized.');
            }
        }
    });
</script>
</body>
</html>
